<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Auth — NERO // AE PRO</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800;900&family=Outfit:wght@600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #090b0e;
      color: #f1f5f9;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows matching Nero website */
    .ambient-glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.22) 0%, rgba(88, 101, 242, 0) 70%);
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(50px);
    }
    .ambient-glow-2 {
      position: absolute;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.12) 0%, rgba(74, 222, 128, 0) 70%);
      bottom: 10%;
      right: 15%;
      pointer-events: none;
      filter: blur(60px);
    }

    /* Subtle grid overlay */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      pointer-events: none;
    }

    /* Top branding nav bar */
    .top-nav {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(18, 22, 28, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #ffffff;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #000000;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
    }
    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    .brand-title span {
      color: #4ade80;
    }
    .brand-tag {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .brand-tag img {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #5865F2;
    }

    /* Main Card */
    .main-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      padding: 20px 0;
    }
    .card {
      background: linear-gradient(145deg, rgba(20, 24, 32, 0.96), rgba(12, 14, 19, 0.98));
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(88, 101, 242, 0.4);
      border-radius: 26px;
      padding: 44px 38px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.06) inset,
        0 0 45px rgba(88, 101, 242, 0.2);
      animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(88, 101, 242, 0.14);
      border: 1px solid rgba(88, 101, 242, 0.35);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5865f2;
      box-shadow: 0 0 8px #5865f2;
      animation: pulseDot 1.6s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Icon Box & User Avatar */
    .icon-wrapper {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto 24px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.28), rgba(88, 101, 242, 0.08));
      border: 1px solid rgba(88, 101, 242, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(88, 101, 242, 0.35);
      overflow: visible;
    }
    .icon-wrapper svg.clyde {
      width: 44px;
      height: 44px;
      fill: #5865f2;
      filter: drop-shadow(0 4px 14px rgba(88, 101, 242, 0.7));
    }
    .icon-wrapper img.user-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: none;
    }
    .icon-check {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #22c55e;
      border: 3px solid #0c0e14;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.75);
    }
    .icon-check svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #000000;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      font-family: 'Outfit', sans-serif;
    }
    h2 span {
      color: #5865f2;
    }

    p.subtext {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    p.subtext strong {
      color: #ffffff;
      font-weight: 700;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5865f2, #22c55e);
      border-radius: 999px;
      transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    }

    /* Buttons */
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #000000;
      padding: 13px 24px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: 0 4px 18px rgba(34, 197, 94, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(34, 197, 94, 0.55);
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
    }

    .btn-discord {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 13px 24px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: 0 4px 18px rgba(88, 101, 242, 0.45);
    }
    .btn-discord:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(88, 101, 242, 0.65);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 11px 20px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: 'Manrope', sans-serif;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 11.5px;
      color: #64748b;
      font-family: 'DM Mono', monospace;
    }

    /* Bottom footer */
    .bottom-bar {
      position: relative;
      z-index: 10;
      font-size: 11.5px;
      color: #475569;
      font-family: 'DM Mono', monospace;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="grid-bg"></div>

  <!-- Top branding -->
  <nav class="top-nav">
    <a href="./index.html" class="brand-link">
      <div class="brand-icon">N</div>
      <div class="brand-title">NERO <span>//</span> AE PRO</div>
    </a>
    <div id="nav-brand-tag" class="brand-tag">DISCORD AUTH ACTIVE</div>
  </nav>

  <!-- Center Card -->
  <div class="main-wrap">
    <div class="card">
      <div id="badge-container" class="badge">
        <span class="badge-dot"></span>
        <span id="badge-text">NERO &bull; DISCORD CONNECTED</span>
      </div>

      <div class="icon-wrapper">
        <svg id="clyde-icon" class="clyde" viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        <img id="user-avatar-img" class="user-avatar-img" alt="Discord Avatar" />
        <div id="icon-check" class="icon-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>

      <h2 id="status-title">Logged In Successfully!</h2>
      <p class="subtext" id="status-desc">Your Discord account is linked. Open After Effects to continue.</p>

      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="actions-grid" id="actions-container">
        <button class="btn-primary" id="btn-open-ae" onclick="returnToAfterEffects()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Open After Effects
        </button>
        <a href="./index.html" class="btn-secondary">
          &larr; Back to Nero Website
        </a>
      </div>

      <div class="footer-note" id="footer-note">
        Syncing to After Effects in background...
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    NERO // AE PRO &bull; Kinetic Typography &amp; AI Subtitle Atelier
  </div>

  <script>
    var DISCORD_CLIENT_ID = '1535710823220125836';
    var CALLBACK_PORT = 18492;
    var REDIRECT_URI = window.location.origin + window.location.pathname;

    var hash = window.location.hash.substring(1);
    var hashParams = new URLSearchParams(hash);
    var token = hashParams.get('access_token');
    var queryParams = new URLSearchParams(window.location.search);
    var status = queryParams.get('status');
    var code = queryParams.get('code');

    var pBar = document.getElementById('progress-bar');
    var statusTitle = document.getElementById('status-title');
    var statusDesc = document.getElementById('status-desc');
    var footerNote = document.getElementById('footer-note');
    var clydeIcon = document.getElementById('clyde-icon');
    var userAvatarImg = document.getElementById('user-avatar-img');
    var navBrandTag = document.getElementById('nav-brand-tag');
    var actionsContainer = document.getElementById('actions-container');

    // Smoothly animate progress bar
    setTimeout(function() {
      if (pBar) pBar.style.width = '100%';
    }, 80);

    function displayUserProfile(user) {
      if (!user) return;
      var name = user.global_name || user.username || 'Discord User';
      var avatarUrl = user.avatar
        ? ('https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.png?size=128')
        : ('https://cdn.discordapp.com/embed/avatars/' + ((user.id ? (user.id >> 22) % 6 : 0)) + '.png');

      if (userAvatarImg) {
        userAvatarImg.src = avatarUrl;
        userAvatarImg.style.display = 'block';
        if (clydeIcon) clydeIcon.style.display = 'none';
      }

      if (navBrandTag) {
        navBrandTag.innerHTML = '<img src="' + avatarUrl + '" /> DISCORD // ' + (user.username || name).toUpperCase();
      }

      statusTitle.innerHTML = 'Welcome, <span>' + name + '</span>!';
      statusDesc.innerHTML = 'Your Discord account is connected and synced with Nero in After Effects.';
    }

    // Check existing stored user
    try {
      var saved = localStorage.getItem('nero_discord_user');
      if (saved) {
        var existingUser = JSON.parse(saved);
        displayUserProfile(existingUser);
      }
    } catch(e) {}

    // SCENARIO 1: Fresh token arriving from Discord OAuth
    if (token && status !== 'success') {
      statusTitle.textContent = 'Linking Discord...';
      statusDesc.textContent = 'Fetching profile and syncing to Nero in After Effects...';
      footerNote.textContent = 'Transmitting credentials to local After Effects session...';

      // 1. Fetch Discord profile immediately
      fetch('https://discord.com/api/v10/users/@me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(res) { return res.json(); })
      .then(function(user) {
        if (user && (user.id || user.username)) {
          localStorage.setItem('nero_discord_user', JSON.stringify(user));
          displayUserProfile(user);
        }
      })
      .catch(function() {})
      .finally(function() {
        // 2. Perform instant bounce to local AE server
        // Port 18492 receives the token, syncs AE, and responds with 302 -> ?status=success
        var targetEndpoint = 'http://127.0.0.1:' + CALLBACK_PORT + '/token?access_token=' + encodeURIComponent(token);
        
        // Also postMessage if opened as popup
        if (window.opener) {
          try { window.opener.postMessage({ type: 'NERO_DISCORD_TOKEN', token: token }, '*'); } catch(e) {}
        }

        // Top-level navigation avoids all PNA / mixed-content blocks
        window.location.replace(targetEndpoint);
      });

    // SCENARIO 2: Successfully bounced back from After Effects (status=success)
    } else if (status === 'success' || (token && status === 'success')) {
      statusTitle.textContent = 'Logged In Successfully!';
      statusDesc.innerHTML = 'Your Discord account is linked. Open After Effects to continue.';
      footerNote.textContent = '✓ Profile Synced to AE! Switch back to After Effects.';

      try {
        var uRaw = localStorage.getItem('nero_discord_user');
        if (uRaw) {
          displayUserProfile(JSON.parse(uRaw));
          footerNote.textContent = '✓ Synced to After Effects! You can close this tab and return to AE.';
        }
      } catch(e) {}

    // SCENARIO 3: Direct visit without active login session
    } else {
      var hasStoredUser = false;
      try {
        hasStoredUser = !!localStorage.getItem('nero_discord_user');
      } catch(e) {}

      if (!hasStoredUser) {
        statusTitle.textContent = 'Connect Discord';
        statusDesc.textContent = 'Link your Discord account to verify your identity and unlock Nero in After Effects.';
        footerNote.textContent = 'Sign in using your official Discord account.';

        var authUrl = 'https://discord.com/oauth2/authorize?client_id=' + DISCORD_CLIENT_ID + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) + '&response_type=token&scope=identify&prompt=consent';

        actionsContainer.innerHTML = `
          <a href="${authUrl}" class="btn-discord">
            <svg viewBox="0 0 127.14 96.36" width="18" height="18" fill="currentColor">
              <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
            Log In with Discord
          </a>
          <a href="./index.html" class="btn-secondary">
            &larr; Back to Nero Website
          </a>
        `;
      }
    }

    function returnToAfterEffects() {
      try {
        window.close();
      } catch(e) {}
      if (footerNote) {
        footerNote.textContent = 'You can switch back to Adobe After Effects now!';
      }
    }
  </script>
</body>
</html>
