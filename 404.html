<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nero &bull; Discord Authorization</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #090b0e;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glows matching Nero website */
    .ambient-glow-1 {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.22) 0%, rgba(88, 101, 242, 0) 70%);
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(40px);
    }
    .ambient-glow-2 {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(158, 224, 56, 0.12) 0%, rgba(158, 224, 56, 0) 70%);
      bottom: 10%;
      right: 20%;
      pointer-events: none;
      filter: blur(50px);
    }

    /* Grid overlay */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      pointer-events: none;
    }

    /* Card styling */
    .card {
      position: relative;
      z-index: 10;
      background: linear-gradient(145deg, rgba(18, 22, 28, 0.95), rgba(12, 14, 18, 0.98));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(88, 101, 242, 0.35);
      border-radius: 24px;
      padding: 44px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 0 40px rgba(88, 101, 242, 0.18);
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(88, 101, 242, 0.12);
      border: 1px solid rgba(88, 101, 242, 0.3);
      color: #9cb1ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 22px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5865f2;
      box-shadow: 0 0 8px #5865f2;
      animation: pulseDot 1.5s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Icon Box */
    .icon-wrapper {
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.25), rgba(88, 101, 242, 0.05));
      border: 1px solid rgba(88, 101, 242, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.3);
    }
    .icon-wrapper svg {
      width: 42px;
      height: 42px;
      fill: #5865f2;
      filter: drop-shadow(0 4px 12px rgba(88, 101, 242, 0.6));
    }
    .icon-check {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #9ee038;
      border: 3px solid #0e121b;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(158, 224, 56, 0.6);
    }
    .icon-check svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #090b0e;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    h2 span {
      color: #5865f2;
    }

    p {
      color: #94a3b8;
      font-size: 13.5px;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5865f2, #9ee038);
      border-radius: 999px;
      transition: width 1.1s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(158, 224, 56, 0.7);
    }

    /* Return button */
    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }
    .btn-return:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="grid-bg"></div>

  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      NERO &times; DISCORD AUTH
    </div>

    <div class="icon-wrapper">
      <!-- Discord Clyde SVG -->
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      <div class="icon-check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
    </div>

    <h2 id="status-title" style="color: #5865F2; margin-bottom: 8px; font-weight: 800;">Discord Connected Successfully!</h2>
    <p id="status-desc" style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">Syncing profile to Nero Extension in After Effects...</p>

    <div class="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <button class="btn-return" id="btn-close" onclick="closeAuthWindow()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
      Close Window &amp; Return to AE
    </button>

    <div class="footer-note" id="footer-note">Auto-closing in a moment...</div>
  </div>

  <script>
    var hash = window.location.hash.substring(1);
    var hashParams = new URLSearchParams(hash);
    var token = hashParams.get('access_token');
    var queryParams = new URLSearchParams(window.location.search);
    var code = queryParams.get('code');
    var rawToken = token || code;

    var pBar = document.getElementById('progress-bar');
    var statusTitle = document.getElementById('status-title');
    var statusDesc = document.getElementById('status-desc');
    var footerNote = document.getElementById('footer-note');

    // Animate progress bar
    setTimeout(function() {
      if (pBar) pBar.style.width = '100%';
    }, 50);

    // 1. Send postMessage if opened in popup
    if (token && window.opener) {
      try {
        window.opener.postMessage({ type: 'NERO_DISCORD_TOKEN', token: token }, '*');
      } catch(e) {
        console.warn('opener postMessage error:', e);
      }
    } else if (code && window.opener) {
      try {
        window.opener.postMessage({ type: 'NERO_DISCORD_CODE', code: code }, '*');
      } catch(e) {
        console.warn('opener postMessage error:', e);
      }
    }

    // 2. Ping local Nero background server inside After Effects
    var CALLBACK_PORT = 18492;
    function pingLocalServer(paramName, paramValue) {
      var targetUrl = 'http://localhost:' + CALLBACK_PORT + '/token?' + paramName + '=' + encodeURIComponent(paramValue);

      // Primary: fetch
      try {
        fetch(targetUrl, { mode: 'no-cors' })
          .then(function() {
            onSyncComplete();
          })
          .catch(function(err) {
            console.log('Local server ping done');
            onSyncComplete();
          });
      } catch(e) {
        onSyncComplete();
      }

      // Secondary beacon fallback (immune to cross-origin or private network blocking)
      try {
        var img = new Image();
        img.src = targetUrl + '&_t=' + Date.now();
      } catch(e) {}
    }

    if (token) {
      pingLocalServer('access_token', token);
    } else if (code) {
      pingLocalServer('code', code);
    } else {
      // Direct visit without params
      statusTitle.innerHTML = 'Nero <span>Discord Auth</span>';
      statusDesc.textContent = 'Ready for authentication. Trigger login from inside the Nero AE extension.';
      footerNote.textContent = 'Waiting for extension token...';
    }

    function onSyncComplete() {
      if (statusTitle) statusTitle.innerHTML = 'Discord Connected Successfully!';
      if (statusDesc) statusDesc.textContent = 'Syncing profile to Nero Extension in After Effects...';
      if (footerNote) footerNote.textContent = 'Profile Synced! Auto-closing...';

      setTimeout(function() {
        closeAuthWindow();
      }, 1200);
    }

    function closeAuthWindow() {
      try {
        window.close();
      } catch(e) {}
      // In case browser prevents programmatic window.close()
      if (footerNote) {
        footerNote.textContent = 'Sync finished. You can now switch back to After Effects!';
      }
    }
  </script>
</body>
</html>
