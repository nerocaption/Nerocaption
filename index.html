    <script>
      (function() {
        function syncDiscordNavbar() {
          try {
            var raw = localStorage.getItem('nero_discord_user');
            if (!raw) return;
            var user = JSON.parse(raw);
            if (!user || (!user.username && !user.id)) return;
            var navLinks = document.querySelectorAll('a[href*="discord.gg"], a[title*="Discord"], a[title*="unoxeoth"]');
            navLinks.forEach(function(link) {
              var span = link.querySelector('span');
              if (span && (span.textContent.indexOf('DISCORD') !== -1 || span.textContent.indexOf('UNOXEOTH') !== -1)) {
                var name = (user.global_name || user.username || 'CONNECTED').toUpperCase();
                span.textContent = 'DISCORD // ' + name;
              }
              var avatar = user.avatar ? ('https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.png?size=64') : null;
              if (avatar && !link.querySelector('.nav-user-pfp')) {
                var img = document.createElement('img');
                img.className = 'nav-user-pfp';
                img.src = avatar;
                img.style.cssText = 'width: 18px; height: 18px; border-radius: 50%; margin-right: 6px; object-fit: cover; border: 1.5px solid #5865F2; display: inline-block; vertical-align: middle;';
                link.insertBefore(img, link.firstChild);
              }
            });
          } catch(e) {}
        }
        window.addEventListener('DOMContentLoaded', syncDiscordNavbar);
        setTimeout(syncDiscordNavbar, 400);
        setTimeout(syncDiscordNavbar, 1200);
        setTimeout(syncDiscordNavbar, 2500);
      })();
    </script>
